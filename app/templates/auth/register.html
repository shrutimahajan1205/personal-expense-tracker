{% extends "base.html" %}

{% block title %}Register - ExpenseWise{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted small">Start organizing your income, budget, and expenses</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Choose a unique username" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-muted">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="currency" class="form-label fw-semibold small text-muted">Preferred Currency Symbol</label>
                <select name="currency" id="currency" class="form-select">
                    <option value="₹" selected>₹ INR (Indian Rupee)</option>
                    <option value="$">$ USD (US Dollar)</option>
                    <option value="€">€ EUR (Euro)</option>
                    <option value="£">£ GBP (British Pound)</option>
                    <option value="¥">¥ JPY (Japanese Yen)</option>
                </select>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="password" class="form-label fw-semibold small text-muted">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 characters" required>
                </div>
                <div class="col-6">
                    <label for="confirm_password" class="form-label fw-semibold small text-muted">Confirm</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">
                <i class="bi bi-check-circle-fill me-1"></i> Create My Account
            </button>
        </form>

        <div class="text-center">
            <span class="text-muted small">Already have an account? </span>
            <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary text-decoration-none">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

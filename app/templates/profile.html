{% extends "base.html" %}

{% block title %}Settings & Profile - ExpenseWise{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="content-card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-person-gear text-primary fs-5"></i>
                <span>User Profile & Preferences</span>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('auth.profile') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted small">Username</label>
                        <input type="text" class="form-control bg-light" value="{{ current_user.username }}" disabled>
                        <div class="form-text">Username cannot be changed.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted small">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ current_user.email }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label for="currency" class="form-label fw-semibold text-muted small">Currency Symbol</label>
                        <select name="currency" id="currency" class="form-select">
                            <option value="₹" {% if current_user.currency == '₹' %}selected{% endif %}>₹ INR (Indian Rupee)</option>
                            <option value="$" {% if current_user.currency == '$' %}selected{% endif %}>$ USD (US Dollar)</option>
                            <option value="€" {% if current_user.currency == '€' %}selected{% endif %}>€ EUR (Euro)</option>
                            <option value="£" {% if current_user.currency == '£' %}selected{% endif %}>£ GBP (British Pound)</option>
                            <option value="¥" {% if current_user.currency == '¥' %}selected{% endif %}>¥ JPY (Japanese Yen)</option>
                        </select>
                    </div>

                    <hr class="my-4">

                    <h6 class="fw-bold mb-3"><i class="bi bi-shield-lock me-1"></i> Change Password</h6>
                    <div class="mb-4">
                        <label for="new_password" class="form-label fw-semibold text-muted small">New Password (leave blank to keep current)</label>
                        <input type="password" class="form-control" name="new_password" id="new_password" placeholder="Enter new password">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
